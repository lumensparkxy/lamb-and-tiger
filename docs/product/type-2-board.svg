<text x="400" y="684" text-anchor="middle" font-size="16">Edges follow the drawn lines between consecutive nodes.</text>
<text x="400" y="710" text-anchor="middle" font-size="16">No L–Q or P–S edges. Spacing does not define capture legality.</text>
<text x="400" y="746" text-anchor="middle" font-size="12">Adapted from “Pulijudam type-2.jpg” · Naidugari Jayanna (2015) · CC BY-SA 4.0</text>
<text x="400" y="766" text-anchor="middle" font-size="12">Project additions: labels, normalized spacing, and annotations.</text>
