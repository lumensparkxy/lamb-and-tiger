<svg xmlns="http://www.w3.org/2000/svg" width="800" height="790" viewBox="0 0 800 790" role="img" aria-labelledby="title description">
<title id="title">Type 2 board: candidate transcription</title>
<desc id="description">Nineteen nodes A through S on a triangle, central vertical, and rectangular crossbar. Thirty edges. Nodes and capture policies await approval. No starting pieces are shown.</desc>
<metadata>Adapted from Pulijudam type-2.jpg by Naidugari Jayanna (2015-12-12), https://commons.wikimedia.org/wiki/File:Pulijudam_type-2.jpg . Geometric redrawing with labels and normalized spacing. Diagram licensed CC BY-SA 4.0, https://creativecommons.org/licenses/by-sa/4.0/ .</metadata>
<rect width="800" height="790" fill="#f7f8fa"/>
<g font-family="Arial, sans-serif" fill="#172b43">
<text x="400" y="39" text-anchor="middle" font-size="24" font-weight="bold">Type 2 board · review draft</text>
<text x="400" y="69" text-anchor="middle" font-size="16">19 nodes · 30 edges · no initial pieces specified</text>
<g stroke="#30485f" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round">
<polyline points="400,115 330,245 260,375 190,505 120,635"/>
<polyline points="400,115 400,245 400,375 400,505 400,635"/>
<polyline points="400,115 470,245 540,375 610,505 680,635"/>
