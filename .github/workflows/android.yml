name: Android verification
on:
  pull_request:
  workflow_dispatch:
    inputs:
      emulator_suite:
        description: Emulator regression coverage
        type: choice
        default: api36
        options:
          - api36
          - full
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - run: ./scripts/doctor.sh
      - name: Run JVM unit tests
        run: ./gradlew :game:test :app:testDebugUnitTest :nearby:testDebugUnitTest --console=plain
      - name: Build and lint for manual regression
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew :app:assembleDebug :app:lintDebug :nearby:lintDebug --console=plain
  emulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.emulator_suite == 'full' && '["29", "34", "36", "37.0"]' || '["36"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Use the pinned SDK tools for emulator-runner
        run: |
          # emulator-runner prepends cmdline-tools/latest, so align that alias
          # with setup-android instead of using the runner image's older tools.
          sdk_tools="$ANDROID_HOME/cmdline-tools"
          test -x "$sdk_tools/16111833/bin/sdkmanager"
          if [ -e "$sdk_tools/latest" ] || [ -L "$sdk_tools/latest" ]; then
            mv "$sdk_tools/latest" "$sdk_tools/preinstalled-latest"
          fi
          ln -s "$sdk_tools/16111833" "$sdk_tools/latest"
      - name: Install the emulator image with bounded download retries
        env:
          IMAGE_API: ${{ matrix.api }}
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "system-images;android-$IMAGE_API;google_apis;x86_64"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 2048M
          disable-animations: true
          script: bash scripts/ci-connected-tests.sh
